<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">TurismoApp</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" data-bs-theme="dark">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">

    <style>
        .dia-reservado {
            background-color: var(--madera-clara) !important;
            border-color: var(--madera-clara) !important;
            color: white !important;
            font-weight: bold;
            box-shadow: 0 0 8px rgba(210, 105, 30, 0.5);
        }

        .flatpickr-calendar.inline {
            width: 100%;
            box-shadow: none;
            border: 1px solid var(--tarjeta-oscura);
            background: var(--fondo-oscuro);
        }
    </style>
</head>

<body>

<th:block th:fragment="navbar">

    <nav class="navbar navbar-expand-lg navbar-dark mb-4 navbar-rustica">
        <div class="container">
            <a class="navbar-brand fs-3 fw-bold" th:href="@{/hoteles}">
                🏔️ TurismoApp
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/hoteles}">Explorar Refugios</a>
                    </li>
                </ul>

                <div class="d-flex align-items-center gap-3">

                    <div sec:authorize="isAnonymous()">
                        <a th:href="@{/login}" class="btn btn-outline-light btn-sm me-2">
                            <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
                        </a>
                        <a th:href="@{/registro}" class="btn btn-rustico btn-sm">
                            Unirse a la Manada
                        </a>
                    </div>

                    <div sec:authorize="isAuthenticated()" class="d-flex align-items-center">
                        <span class="text-light me-3 d-none d-md-block">
                            Hola, <strong class="text-warning" th:text="${usuarioLogueado != null ? usuarioLogueado.nombre : #authentication.name}">Usuario</strong>
                        </span>

                        <button class="btn btn-outline-light position-relative rounded-circle p-0"
                                style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; overflow: hidden; border-color: var(--madera-clara);"
                                type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasUser" aria-controls="offcanvasUser">

                            <img th:if="${usuarioLogueado != null and usuarioLogueado.avatarUrl != null}"
                                 th:src="${usuarioLogueado.avatarUrl}"
                                 alt="Avatar"
                                 class="w-100 h-100 object-fit-cover">

                            <span th:unless="${usuarioLogueado != null and usuarioLogueado.avatarUrl != null}"
                                  class="fw-bold text-white fs-5"
                                  th:text="${#strings.substring(#authentication.name, 0, 1).toUpperCase()}">U</span>

                            <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle">
                                <span class="visually-hidden">Alertas</span>
                            </span>
                        </button>
                    </div>

                </div>
            </div>
        </div>
    </nav>

    <div sec:authorize="isAuthenticated()" class="offcanvas offcanvas-end offcanvas-rustico" tabindex="-1" id="offcanvasUser" aria-labelledby="offcanvasUserLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title fw-bold" id="offcanvasUserLabel"><i class="bi bi-compass"></i> Mi Panel</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>

        <div class="offcanvas-body d-flex flex-column">

            <div class="text-center mb-4 pt-3">
                <div class="mb-3 d-flex justify-content-center">
                    <img th:if="${usuarioLogueado != null and usuarioLogueado.avatarUrl != null}"
                         th:src="${usuarioLogueado.avatarUrl}"
                         alt="Avatar"
                         class="rounded-circle object-fit-cover shadow"
                         style="width: 80px; height: 80px; border: 3px solid var(--madera-clara);">

                    <div th:unless="${usuarioLogueado != null and usuarioLogueado.avatarUrl != null}"
                         class="d-flex align-items-center justify-content-center rounded-circle shadow fw-bold"
                         style="width: 80px; height: 80px; font-size: 2rem; background-color: var(--madera-clara); color: white;">
                        <span th:text="${#strings.substring(#authentication.name, 0, 1).toUpperCase()}">U</span>
                    </div>
                </div>

                <h6 class="fw-bold mb-0" th:text="${usuarioLogueado != null ? usuarioLogueado.nombre : #authentication.name}">Nombre</h6>
                <small class="text-light opacity-75" sec:authentication="name">usuario@email.com</small>
            </div>

            <hr class="border-secondary opacity-50">

            <ul class="nav flex-column gap-2 mb-4">
                <li class="nav-item">
                    <a th:href="@{/perfil}" class="nav-link">
                        <i class="bi bi-person-vcard fs-5"></i> Mi Perfil Completo
                    </a>
                </li>
                <li class="nav-item">
                    <a th:href="@{/reservas/mis-reservas}" class="nav-link">
                        <i class="bi bi-calendar2-check fs-5"></i> Mis Reservas
                        <span class="badge bg-warning text-dark ms-auto rounded-pill"
                              th:text="${numReservas}"
                              th:if="${numReservas > 0}">
                            0
                        </span>
                    </a>
                </li>
                <li class="nav-item">
                    <a th:href="@{/alertas}" class="nav-link">
                        <i class="bi bi-bell-fill text-info fs-5"></i> Alertas de Precio

                        <span class="badge bg-info text-dark ms-auto rounded-pill"
                              th:text="${numAlertas}"
                              th:if="${numAlertas > 0}">
                            0
                        </span>
                    </a>
                </li>
                <li class="nav-item">
                    <a th:href="@{/favoritos}" class="nav-link">
                        <i class="bi bi-heart-fill text-danger fs-5"></i> Favoritos

                        <span class="badge bg-danger text-white ms-auto rounded-pill"
                              th:text="${numFavoritos}"
                              th:if="${numFavoritos > 0}">
                            0
                        </span>
                    </a>
                </li>
            </ul>

            <div class="px-3 mb-auto">
                <h6 class="text-light fw-bold mb-3"><i class="bi bi-calendar-range text-warning me-2"></i>Mis próximas fechas</h6>
                <input type="text" id="miniCalendarioSidebar" class="d-none">
            </div>

            <hr class="border-secondary opacity-50 mt-4">

            <div class="mt-3">
                <form th:action="@{/logout}" method="post">
                    <button class="btn btn-outline-danger w-100 d-flex align-items-center justify-content-center gap-2" type="submit">
                        <i class="bi bi-power"></i> Cerrar Sesión
                    </button>
                </form>
            </div>

            <div class="text-center mt-4">
                <small class="text-white-50" style="font-size: 0.7rem;">TurismoApp v1.2</small>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/es.js"></script>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script th:inline="javascript">
        document.addEventListener("DOMContentLoaded", function() {
            const miniCalInput = document.getElementById('miniCalendarioSidebar');

            // Solo lo inicializamos si el usuario está logueado y el input existe
            if (miniCalInput) {
                // Recuperamos las fechas desde Thymeleaf
                const misReservas = /*[[${misFechasReservadas}]]*/ [];

                flatpickr(miniCalInput, {
                    inline: true, // Se muestra siempre abierto
                    locale: "es",
                    showMonths: 1,
                    clickOpens: false, // Desactiva que intente abrir un pop-up

                    // Magia de Flatpickr: Esto se ejecuta al dibujar CADA día del calendario
                    onDayCreate: function(dObj, dStr, fp, dayElem) {

                        // Recorremos los rangos de reserva que vienen del servidor
                        const estaReservado = misReservas.some(rango => {
                            // Convertimos los textos "dd/mm/yyyy" a fechas comparables
                            const fromDate = fp.parseDate(rango.from, "d/m/Y");
                            const toDate = fp.parseDate(rango.to, "d/m/Y");

                            // Si el día actual que está dibujando está dentro del rango...
                            return dayElem.dateObj >= fromDate && dayElem.dateObj <= toDate;
                        });

                        // Si está reservado, le inyectamos nuestra clase CSS personalizada
                        if (estaReservado) {
                            dayElem.classList.add('dia-reservado');
                        }
                    }
                });
            }
        });
    </script>

</th:block>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
