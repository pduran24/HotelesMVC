<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurismoApp - Iniciar Sesión</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>

<div class="card login-card" style="background-color: var(--tarjeta-oscura); border: 1px solid var(--madera-clara);">
    <div class="text-center mb-4">
        <h2 class="fw-bold text-light">TurismoApp</h2>
        <p style="color: var(--madera-clara);">Refugios y Alojamientos del Pirineo</p>
    </div>

    <div th:if="${param.error}" class="alert alert-danger" role="alert" style="background-color: #4a1414; color: #ffb3b3; border: none;">
        Usuario o contraseña incorrectos.
    </div>
    <div th:if="${param.logout}" class="alert alert-success" role="alert" style="background-color: var(--verde-pino); color: white; border: none;">
        Has cerrado sesión correctamente.
    </div>
    <div th:if="${param.registrado}" class="alert alert-success" style="background-color: var(--verde-pino); color: white; border: none;">
        ¡Cuenta creada con éxito! Ya puedes iniciar sesión.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label text-light">Usuario</label>
            <input type="text" class="form-control bg-dark text-light border-secondary" id="username" name="username" required autofocus>
        </div>
        <div class="mb-4">
            <label for="password" class="form-label text-light">Contraseña</label>
            <input type="password" class="form-control bg-dark text-light border-secondary" id="password" name="password" required>
        </div>
        <div class="d-grid">
            <button type="submit" class="btn btn-rustico btn-lg">Entrar al Refugio</button>
        </div>
    </form>
    <div class="text-center mt-3 mb-2">
        <span class="text-light">¿No tienes cuenta?</span>
        <a th:href="@{/registro}" class="text-decoration-none fw-bold" style="color: var(--naranja-fuego);">Regístrate aquí</a>
    </div>
    <div class="text-center mt-4">
        <a th:href="@{/hoteles}" class="text-decoration-none" style="color: var(--madera-clara);">← Volver al listado público</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
