<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">

<head th:replace="~{fragments/layout :: head('Bono de Reserva')}"></head>

<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4 d-print-none">
        <a th:href="@{/reservas/mis-reservas}" class="link-volver fw-bold">
            <i class="bi bi-arrow-left me-1"></i> Volver a Mis Reservas
        </a>
        <button onclick="window.print()" class="btn btn-outline-light">
            <i class="bi bi-printer me-2"></i>Imprimir / Guardar PDF
        </button>
    </div>

    <div class="card card-detalle border-0 shadow-lg overflow-hidden mx-auto" style="max-width: 900px; border-radius: 16px;">
        <div class="row g-0">

            <div class="col-md-5 d-none d-md-block position-relative" style="background-color: var(--madera-oscura);">

                <img th:if="${reserva.hotel.imagenes != null and !reserva.hotel.imagenes.isEmpty()}"
                     th:src="${reserva.hotel.imagenes[0].url}"
                     class="img-fluid h-100 w-100" style="object-fit: cover;" alt="Foto del Hotel">

                <img th:unless="${reserva.hotel.imagenes != null and !reserva.hotel.imagenes.isEmpty()}"
                     th:src="@{'https://picsum.photos/seed/' + ${reserva.hotel.id} + '/800/1200'}"
                     class="img-fluid h-100 w-100" style="object-fit: cover;" alt="Foto por defecto">

                <div class="position-absolute top-0 start-0 w-100 h-100" style="background: linear-gradient(to right, transparent, var(--tarjeta-oscura));"></div>
            </div>

            <div class="col-md-7 position-relative">
                <div class="p-4 p-md-5">

                    <div class="d-flex justify-content-between align-items-start mb-4">
                        <div>
                            <h6 class="text-warning fw-bold mb-1 letter-spacing-1">VOUCHER DE ALOJAMIENTO</h6>
                            <h3 class="fw-bold text-white mb-1" th:text="${reserva.hotel.nombre}">Nombre Hotel</h3>
                            <p class="text-muted small mb-0"><i class="bi bi-geo-alt-fill text-danger me-1"></i> <span th:text="${reserva.hotel.ubicacion}">Ubicación</span></p>
                        </div>
                        <span class="badge rounded-pill fs-6 shadow-sm"
                              th:classappend="${reserva.estado.name() == 'CONFIRMADA' ? 'bg-success' : 'bg-danger'}"
                              th:text="${reserva.estado}">CONFIRMADA</span>
                    </div>

                    <div class="row mb-4 g-3">
                        <div class="col-6">
                            <label class="text-muted small fw-bold mb-1">LOCALIZADOR</label>
                            <div class="fs-4 text-white fw-bold font-monospace" th:text="'#RES-' + ${reserva.id}">#RES-1</div>
                        </div>
                        <div class="col-6">
                            <label class="text-muted small fw-bold mb-1">HUÉSPED PRINCIPAL</label>
                            <div class="fs-5 text-white" th:text="${reserva.cliente.nombre}">Nombre del Cliente</div>
                        </div>
                    </div>

                    <div class="p-3 mb-4 rounded" style="background-color: rgba(255,255,255,0.03); border: 2px dashed var(--madera-clara);">
                        <div class="row text-center align-items-center">
                            <div class="col-5">
                                <label class="text-warning small fw-bold mb-1">CHECK-IN</label>
                                <div class="fs-4 text-white fw-bold" th:text="${#temporals.format(reserva.fechaEntrada, 'dd MMM yyyy')}">12 Oct 2026</div>
                                <small class="text-muted">A partir de las 14:00</small>
                            </div>
                            <div class="col-2">
                                <i class="bi bi-arrow-right text-muted fs-3"></i>
                            </div>
                            <div class="col-5">
                                <label class="text-warning small fw-bold mb-1">CHECK-OUT</label>
                                <div class="fs-4 text-white fw-bold" th:text="${#temporals.format(reserva.fechaSalida, 'dd MMM yyyy')}">15 Oct 2026</div>
                                <small class="text-muted">Antes de las 12:00</small>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-end mt-4 pt-3 border-top border-secondary">
                        <div>
                            <span class="text-muted small d-block mb-1">Duración de la estancia</span>
                            <span class="text-white fs-5"><strong class="text-warning" th:text="${reserva.numeroNoches}">3</strong> Noches</span>
                        </div>
                        <div class="text-end">
                            <span class="text-muted small d-block mb-1">Importe Total (Impuestos Inc.)</span>
                            <span class="fs-1 fw-bold text-success"><span th:text="${reserva.precioTotal}">350</span>€</span>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
