<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">TurismoApp</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" data-bs-theme="dark">
    <link rel="stylesheet" th:href="@{/css/global.css}">
</head>

<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark mb-4" style="background-color: var(--madera-oscura); border-bottom: 3px solid var(--naranja-fuego); box-shadow: 0 4px 6px rgba(0,0,0,0.3);" data-bs-theme="dark">
    <div class="container">
        <a class="navbar-brand fw-bold text-light" th:href="@{/hoteles}">TurismoApp Pirineos</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/hoteles}">Alojamientos</a>
                </li>
            </ul>

            <div class="d-flex align-items-center">

                <div sec:authorize="isAuthenticated()" class="d-flex align-items-center">
                    <span class="text-light me-3">
                        Bienvenido, <strong style="color: var(--naranja-fuego);" sec:authentication="name">Usuario</strong>
                    </span>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button class="btn btn-outline-light btn-sm" type="submit">Cerrar Sesión</button>
                    </form>
                </div>

                <div sec:authorize="isAnonymous()">
                    <a th:href="@{/login}" class="btn btn-outline-light btn-sm me-2">Iniciar Sesión</a>
                    <a th:href="@{/registro}" class="btn btn-rustico btn-sm">Registrarse</a>
                </div>

            </div>
        </div>
    </div>
</nav>

</body>
</html>
