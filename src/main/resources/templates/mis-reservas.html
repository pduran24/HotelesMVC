<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">

<head th:replace="~{fragments/layout :: head('Mis Reservas')}"></head>

<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container py-5">

    <h2 class="text-white fw-bold mb-4">
        <i class="bi bi-calendar-check text-warning me-2"></i>Mis Escapadas
    </h2>

    <div th:if="${reservas.isEmpty()}" class="text-center py-5">
        <div class="mb-3">
            <i class="bi bi-emoji-frown display-1 text-muted"></i>
        </div>
        <h4 class="text-light">Aún no tienes aventuras planeadas</h4>
        <p class="text-muted">¡El Pirineo te está esperando!</p>
        <a th:href="@{/hoteles}" class="btn btn-rustico mt-3">Explorar Refugios</a>
    </div>

    <div class="row g-4" th:unless="${reservas.isEmpty()}">
        <div class="col-md-6 col-xl-4" th:each="reserva : ${reservas}">

            <div class="card card-detalle h-100 position-relative">

                    <span class="position-absolute top-0 end-0 m-3 badge rounded-pill"
                          th:classappend="${reserva.estado.name() == 'CONFIRMADA' ? 'bg-success' : 'bg-danger'}"
                          th:text="${reserva.estado}">
                        CONFIRMADA
                    </span>

                <div class="card-body">
                    <h5 class="card-title fw-bold text-warning mb-3" th:text="${reserva.hotelNombre}">
                        Gran Hotel La Florida
                    </h5>

                    <div class="d-flex align-items-center mb-2">
                        <i class="bi bi-calendar-range me-2 text-light opacity-50"></i>
                        <span class="text-white">
                                <span th:text="${#temporals.format(reserva.fechaEntrada(), 'dd MMM yyyy')}"></span>
                                &rarr;
                                <span th:text="${#temporals.format(reserva.fechaSalida(), 'dd MMM yyyy')}"></span>
                            </span>
                    </div>

                    <div class="d-flex align-items-center mb-3">
                        <i class="bi bi-moon-stars me-2 text-light opacity-50"></i>
                        <span class="text-light">
                                <span th:text="${reserva.numeroDias}">3</span> noches
                            </span>
                    </div>

                    <hr class="border-secondary opacity-25">

                    <div class="d-flex justify-content-between align-items-center">
                        <span class="text-muted small">Precio Total</span>
                        <span class="fs-4 fw-bold text-success">
                                <span th:text="${reserva.precioTotal}">350.00</span>€
                            </span>
                    </div>
                </div>

                <div class="card-footer border-secondary bg-transparent d-flex gap-2">
                    <button class="btn btn-outline-light btn-sm w-100">
                        <i class="bi bi-eye"></i> Ver Detalles
                    </button>
                    <button th:if="${reserva.estado.name() == 'CONFIRMADA'}"
                            class="btn btn-outline-danger btn-sm"
                            title="Cancelar Reserva">
                        <i class="bi bi-x-lg"></i>
                    </button>
                </div>
            </div>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
