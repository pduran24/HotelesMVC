<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>TurismoApp - Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<div class="card login-card" style="background-color: var(--tarjeta-oscura); border: 1px solid var(--madera-clara);">
    <div class="text-center mb-4">
        <h2 class="fw-bold text-light">Únete al Refugio</h2>
        <p style="color: var(--madera-clara);">Crea tu cuenta para reservar</p>
    </div>
    <form th:action="@{/registro}" method="post">

        <div class="mb-3">
            <label for="nombre" class="form-label text-light">Nombre Completo</label>
            <input type="text" class="form-control bg-dark text-light border-secondary"
                   id="nombre" name="nombre" placeholder="Ej: Pablo Viajero" required autofocus>
        </div>

        <div class="mb-3">
            <label for="username" class="form-label text-light">Correo Electrónico</label>
            <input type="email" class="form-control bg-dark text-light border-secondary"
                   id="username" name="username" placeholder="nombre@ejemplo.com" required>
        </div>

        <div class="mb-4">
            <label for="password" class="form-label text-light">Contraseña</label>
            <input type="password" class="form-control bg-dark text-light border-secondary"
                   id="password" name="password" required minlength="4">
        </div>

        <div class="d-grid">
            <button type="submit" class="btn btn-rustico btn-lg">Registrarse</button>
        </div>
    </form>

    <div th:if="${errorRegistro}" class="alert alert-danger mt-4 text-center" style="background-color: #4a1414; color: #ffb3b3; border: 1px solid #ffb3b3;">
        ⚠️ <span th:text="${errorRegistro}">El usuario ya existe.</span>
    </div>

    <div class="text-center mt-4">
        <a th:href="@{/login}" class="text-decoration-none" style="color: var(--madera-clara);">← Ya tengo cuenta</a>
    </div>
</div>
</body>
</html>
