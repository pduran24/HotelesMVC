<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">

<head th:replace="~{fragments/layout :: head('Mi Perfil')}"></head>

<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <div class="card card-detalle text-center p-4">
                <div class="card-body">
                    <div class="user-avatar-placeholder mb-4" style="width: 100px; height: 100px; font-size: 2.5rem;">
                        <span th:text="${#strings.substring(cliente.nombre, 0, 1)}">U</span>
                    </div>

                    <h2 class="fw-bold text-light mb-1" th:text="${cliente.nombre}">Nombre Usuario</h2>
                    <p class="text-muted mb-4" th:text="${cliente.email}">usuario@email.com</p>

                    <div class="d-flex justify-content-around mb-4 border-top border-bottom border-secondary py-3">
                        <div class="text-center">
                            <h3 class="fw-bold text-warning" th:text="${cliente.favoritos.size()}">0</h3>
                            <small class="text-light">Favoritos</small>
                        </div>
                        <div class="text-center">
                            <h3 class="fw-bold text-success">0</h3>
                            <small class="text-light">Reservas</small>
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <a th:href="@{/favoritos}" class="btn btn-outline-light">
                            <i class="bi bi-heart-fill text-danger me-2"></i> Ver mis Favoritos
                        </a>
                        <a th:href="@{/reservas/mis-reservas}" class="btn btn-outline-light">
                            <i class="bi bi-calendar-check me-2"></i> Gestionar Reservas
                        </a>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
