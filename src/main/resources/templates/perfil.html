<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">

<head>
    <th:block th:replace="~{fragments/layout :: head('Mi Perfil')}"></th:block>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css"/>
    <style>
        .img-container img { max-width: 100%; } /* Evita que las fotos gigantes rompan el modal */
    </style>
</head>

<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container py-5 pb-5 mb-5">

    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${mensajeExito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div id="js-alert-container"></div>

    <div class="row g-4">

        <div class="col-lg-4">
            <div class="card card-detalle text-center p-4 border-0 shadow-lg" style="border-radius: 16px; position: sticky; top: 20px;">
                <div class="card-body">

                    <div class="mb-4 d-flex justify-content-center">
                        <img th:if="${cliente.avatarUrl != null}" th:src="${cliente.avatarUrl}" alt="Avatar" class="rounded-circle shadow-lg object-fit-cover" style="width: 120px; height: 120px; border: 4px solid var(--madera-clara);">

                        <div th:unless="${cliente.avatarUrl != null}" class="user-avatar-placeholder d-flex align-items-center justify-content-center rounded-circle shadow-lg fw-bold" style="width: 120px; height: 120px; font-size: 3rem; background-color: var(--madera-clara); color: #fff;">
                            <span th:text="${#strings.substring(cliente.nombre, 0, 1).toUpperCase()}">U</span>
                        </div>
                    </div>

                    <h3 class="fw-bold text-light mb-1" th:text="${cliente.nombre}">Nombre Usuario</h3>
                    <p class="text-muted mb-3" th:text="${cliente.email}">usuario@email.com</p>
                    <p class="text-light opacity-75 fst-italic mb-4 small" th:text="${cliente.biografia != null and !cliente.biografia.isEmpty()} ? '«' + ${cliente.biografia} + '»' : 'Sin biografía.'"></p>

                    <div class="d-flex justify-content-around mb-4 border-top border-bottom border-secondary py-3">
                        <div class="text-center">
                            <h3 class="fw-bold text-warning mb-0" th:text="${cliente.favoritos.size()}">0</h3>
                            <small class="text-muted text-uppercase" style="font-size: 0.7rem;">Favoritos</small>
                        </div>
                        <div class="text-center">
                            <h3 class="fw-bold text-success mb-0" th:text="${cliente.reservas.size()}">0</h3>
                            <small class="text-muted text-uppercase" style="font-size: 0.7rem;">Reservas</small>
                        </div>
                    </div>

                    <div class="d-grid gap-3">
                        <a th:href="@{/favoritos}" class="btn btn-outline-light rounded-pill">
                            <i class="bi bi-heart-fill text-danger me-2"></i> Mis Favoritos
                        </a>
                        <a th:href="@{/reservas/mis-reservas}" class="btn btn-outline-light rounded-pill">
                            <i class="bi bi-calendar-check text-success me-2"></i> Mis Reservas
                        </a>
                    </div>

                </div>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="card card-detalle p-4 p-lg-5 border-0 shadow-lg" style="border-radius: 16px;">
                <h4 class="fw-bold mb-4 text-white border-bottom border-secondary pb-3">
                    <i class="bi bi-pencil-square text-warning me-2"></i>Editar Perfil
                </h4>

                <form id="formPerfil" th:action="@{/perfil/editar}" method="post" enctype="multipart/form-data">

                    <div class="mb-4 text-center p-4 border border-secondary border-dashed rounded bg-dark" style="border-style: dashed !important;">
                        <label class="form-label text-muted small fw-bold d-block">ACTUALIZAR FOTO DE PERFIL</label>

                        <input type="file" id="avatarInputHidden" accept="image/png, image/jpeg, image/webp" style="display: none;">

                        <button type="button" class="btn btn-outline-warning rounded-pill px-4 py-2 mt-2" onclick="document.getElementById('avatarInputHidden').click();">
                            <i class="bi bi-camera-fill me-2"></i>Seleccionar y Recortar Foto
                        </button>
                        <div class="form-text text-muted mt-2">Te pediremos que centres la imagen en un cuadrado antes de subirla.</div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="nombre" class="form-label text-muted small fw-bold">NOMBRE COMPLETO</label>
                            <input type="text" class="form-control bg-dark text-white border-secondary" id="nombre" name="nombre" th:value="${cliente.nombre}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="telefono" class="form-label text-muted small fw-bold">TELÉFONO</label>
                            <input type="tel" class="form-control bg-dark text-white border-secondary" id="telefono" name="telefono" th:value="${cliente.telefono}" placeholder="+34 600 000 000">
                        </div>
                    </div>

                    <div class="mb-5">
                        <label for="biografia" class="form-label text-muted small fw-bold">BIOGRAFÍA O LEMA VIAJERO</label>
                        <textarea class="form-control bg-dark text-white border-secondary" id="biografia" name="biografia" rows="3" placeholder="¿Qué tipo de montañero eres?" th:text="${cliente.biografia}"></textarea>
                    </div>

                    <div class="text-end">
                        <button type="submit" class="btn btn-rustico btn-lg px-5 fw-bold rounded-pill shadow" id="btnGuardarNormal">
                            <i class="bi bi-floppy me-2"></i>Guardar Cambios
                        </button>
                        <button class="btn btn-rustico btn-lg px-5 fw-bold rounded-pill shadow d-none" type="button" id="btnCargando" disabled>
                            <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Subiendo y Guardando...
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="cropModal" tabindex="-1" aria-labelledby="cropModalLabel" aria-hidden="true" data-bs-backdrop="static">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content bg-dark text-white border-secondary">
            <div class="modal-header border-secondary">
                <h5 class="modal-title fw-bold"><i class="bi bi-crop me-2 text-warning"></i>Centrar Avatar</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-0">
                <div class="img-container" style="max-height: 60vh; background-color: #000;">
                    <img id="imageToCrop" src="" style="display: block; max-width: 100%;">
                </div>
            </div>
            <div class="modal-footer border-secondary">
                <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-rustico fw-bold px-4" id="btnRecortarYGuardar">
                    <i class="bi bi-scissors me-2"></i>Aplicar Recorte y Guardar
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const avatarInput = document.getElementById('avatarInputHidden');
        const imageToCrop = document.getElementById('imageToCrop');
        const cropModalEl = document.getElementById('cropModal');
        const cropModal = new bootstrap.Modal(cropModalEl);
        const btnRecortar = document.getElementById('btnRecortarYGuardar');
        const formPerfil = document.getElementById('formPerfil');

        const btnGuardarNormal = document.getElementById('btnGuardarNormal');
        const btnCargando = document.getElementById('btnCargando');
        const jsAlertContainer = document.getElementById('js-alert-container');

        let cropper;

        avatarInput.addEventListener('change', function(e) {
            const files = e.target.files;
            if (files && files.length > 0) {
                const file = files[0];
                if (!file.type.startsWith('image/')) { alert("Selecciona una imagen válida."); return; }

                const reader = new FileReader();
                reader.onload = function(event) {
                    imageToCrop.src = event.target.result;
                    cropModal.show();
                };
                reader.readAsDataURL(file);
            }
            avatarInput.value = '';
        });

        cropModalEl.addEventListener('shown.bs.modal', function () {
            if (cropper) { cropper.destroy(); }

            cropper = new Cropper(imageToCrop, {
                aspectRatio: 1,
                viewMode: 2,
                guides: true,
                autoCropArea: 0.9,
                movable: false,
                zoomable: true,
            });
        });

        btnRecortar.addEventListener('click', function() {
            if (!cropper) return;

            const canvas = cropper.getCroppedCanvas({
                width: 400,
                height: 400,
                fillColor: '#fff',
                imageSmoothingEnabled: true,
                imageSmoothingQuality: 'high',
            });

            canvas.toBlob(function(blob) {
                cropModal.hide();

                btnGuardarNormal.classList.add('d-none');
                btnCargando.classList.remove('d-none');

                const formData = new FormData(formPerfil);
                formData.set('avatarFile', blob, 'avatar.jpg');

                fetch(formPerfil.action, {
                    method: 'POST',
                    body: formData
                })
                    .then(response => {
                        if (response.redirected) {
                            window.location.href = response.url;
                        } else {
                            throw new Error('No se pudo redirigir.');
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        jsAlertContainer.innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
                    })
                    .finally(() => {
                        btnGuardarNormal.classList.remove('d-none');
                        btnCargando.classList.add('d-none');
                    });
            }, 'image/jpeg', 0.9);
        });
    });
</script>

</body>
</html>
