<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">

<head th:replace="~{fragments/layout :: head(${hotel.nombre} + ' - TurismoApp')}"></head>

<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">

<div class="container pb-5">

    <div class="mb-4">
        <a th:href="@{/hoteles}" class="link-volver fw-bold">
            ← Volver al listado de refugios
        </a>
    </div>

    <div class="card card-detalle" style="border-radius: 12px; overflow: hidden;">
        <div class="row g-0">

            <div class="col-md-6">
                <img th:src="@{'https://picsum.photos/seed/' + ${hotel.id} + '/800/600'}"
                     class="img-fluid w-100 h-100" alt="Foto del refugio" style="object-fit: cover; min-height: 400px;">
            </div>

            <div class="col-md-6 d-flex flex-column">
                <div class="card-body p-4 p-md-5">

                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h2 class="card-title fw-bold text-light mb-0" th:text="${hotel.nombre}">Nombre Hotel</h2>
                        <span class="badge precio-badge px-3 py-2 fs-5" th:text="${hotel.precioNoche} + ' €/noche'">100 €</span>
                    </div>

                    <p class="text-muted mb-4 fs-5">
                        📍 <span th:text="${hotel.ubicacion}">Ubicación</span> <br>
                        ⭐ <span th:text="${hotel.estrellas}">4</span> Estrellas
                    </p>

                    <h5 class="fw-bold" style="color: var(--madera-clara);">Sobre este refugio</h5>
                    <p class="card-text text-light mb-4" th:text="${hotel.descripcion}" style="line-height: 1.8;">
                        Descripción completa detallada del hotel...
                    </p>

                    <div class="mt-auto pt-3 border-top border-secondary">

                        <div th:if="${error}" class="alert alert-danger mb-3" th:text="${error}"></div>

                        <div id="js-error-alert" class="alert alert-danger d-flex align-items-center d-none" role="alert">
                            <i class="bi bi-exclamation-triangle-fill flex-shrink-0 me-2"></i>
                            <div id="js-error-text">
                            </div>
                        </div>

                        <form th:action="@{/reservas/crear}" method="post" onsubmit="return validarFechas()">
                            <input type="hidden" name="hotelId" th:value="${hotel.id}">

                            <div class="mb-3">
                                <label for="rangoFechas" class="form-label fw-bold" style="color: var(--madera-clara);">
                                    <i class="bi bi-calendar-range me-2"></i>Selecciona tus fechas
                                </label>
                                <input type="text" id="rangoFechas" class="form-control bg-dark text-white border-secondary text-center fs-5"
                                       placeholder="Haz clic para elegir" required>
                            </div>

                            <input type="hidden" id="fechaEntrada" name="fechaEntrada">
                            <input type="hidden" id="fechaSalida" name="fechaSalida">

                            <div class="d-grid gap-2 mt-3">
                                <button type="submit" class="btn btn-rustico btn-lg fw-bold">
                                    <i class="bi bi-check-circle me-2"></i> Confirmar Reserva
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://npmcdn.com/flatpickr/dist/l10n/es.js"></script>

<script th:inline="javascript">
    const errorAlertBox = document.getElementById('js-error-alert');
    const errorText = document.getElementById('js-error-text');
    const inputEntrada = document.getElementById('fechaEntrada');
    const inputSalida = document.getElementById('fechaSalida');


    const fechasBloqueadas = /*[[${fechasOcupadas}]]*/ [];

    flatpickr("#rangoFechas", {
        mode: "range",
        minDate: "today",
        locale: "es",
        dateFormat: "d/m/Y",

        disable: fechasBloqueadas,

        onChange: function(selectedDates, dateStr, instance) {
            if (selectedDates.length === 2) {
                inputEntrada.value = flatpickr.formatDate(selectedDates[0], "Y-m-d");
                inputSalida.value = flatpickr.formatDate(selectedDates[1], "Y-m-d");
                errorAlertBox.classList.add('d-none');
            } else {
                inputEntrada.value = "";
                inputSalida.value = "";
            }
        }
    });

    function validarFechas() {
        const entrada = inputEntrada.value;
        const salida = inputSalida.value;

        if (!entrada || !salida) {
            errorText.textContent = "Por favor, selecciona un rango de fechas completo (inicio y fin) en el calendario antes de continuar.";
            errorAlertBox.classList.remove('d-none');
            return false;
        }

        errorAlertBox.classList.add('d-none');
        return true;
    }
</script>

</body>
</html>
