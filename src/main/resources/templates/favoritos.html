<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">

<head th:replace="~{fragments/layout :: head('Mis Favoritos')}"></head>

<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container py-5">

    <div class="d-flex align-items-center mb-4">
        <h2 class="text-white fw-bold mb-0">
            <i class="bi bi-heart-fill text-danger me-2"></i>Mi Wishlist
        </h2>
    </div>

    <div th:if="${hotelesFavoritos.isEmpty()}" class="text-center py-5">
        <div class="mb-3">
            <i class="bi bi-heartbreak display-1 text-muted"></i>
        </div>
        <h4 class="text-light">Tu lista de deseos está vacía</h4>
        <p class="text-muted">Encuentra tu refugio perfecto en las montañas.</p>
        <a th:href="@{/hoteles}" class="btn btn-rustico mt-3">Explorar Refugios</a>
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" th:unless="${hotelesFavoritos.isEmpty()}">

        <div class="col" th:each="hotel : ${hotelesFavoritos}">
            <div class="card card-hotel h-100 overflow-hidden shadow-sm">

                <div class="position-relative">

                    <div th:id="'carrusel-fav-' + ${hotel.id}" class="carousel slide" data-bs-ride="carousel" data-bs-interval="4000">

                        <div class="carousel-indicators" th:if="${hotel.imagenes != null and !hotel.imagenes.isEmpty()}">
                            <button th:each="img, iterStat : ${hotel.imagenes}"
                                    type="button"
                                    th:data-bs-target="'#carrusel-fav-' + ${hotel.id}"
                                    th:data-bs-slide-to="${iterStat.index}"
                                    th:classappend="${iterStat.first} ? 'active' : ''"
                                    th:aria-current="${iterStat.first} ? 'true' : 'false'">
                            </button>
                        </div>

                        <div class="carousel-inner">
                            <th:block th:if="${hotel.imagenes != null and !hotel.imagenes.isEmpty()}">
                                <div th:each="img, iterStat : ${hotel.imagenes}"
                                     class="carousel-item"
                                     th:classappend="${iterStat.first} ? 'active' : ''">
                                    <img th:src="${img.url}" class="card-img-top d-block w-100" alt="Foto del refugio" style="height: 200px; object-fit: cover;">
                                </div>
                            </th:block>

                            <th:block th:if="${hotel.imagenes == null or hotel.imagenes.isEmpty()}">
                                <div class="carousel-item active">
                                    <img th:src="@{'https://picsum.photos/seed/' + ${hotel.id} + '/600/400'}"
                                         class="card-img-top d-block w-100" alt="Foto por defecto" style="height: 200px; object-fit: cover;">
                                </div>
                            </th:block>
                        </div>

                        <th:block th:if="${hotel.imagenes != null and hotel.imagenes.size() > 1}">
                            <button class="carousel-control-prev" type="button" th:data-bs-target="'#carrusel-fav-' + ${hotel.id}" data-bs-slide="prev">
                                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                                <span class="visually-hidden">Anterior</span>
                            </button>
                            <button class="carousel-control-next" type="button" th:data-bs-target="'#carrusel-fav-' + ${hotel.id}" data-bs-slide="next">
                                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                                <span class="visually-hidden">Siguiente</span>
                            </button>
                        </th:block>
                    </div>

                    <div class="position-absolute top-0 end-0 m-2" style="z-index: 10;">
                        <form th:action="@{/favoritos/toggle}" method="post">
                            <input type="hidden" name="hotelId" th:value="${hotel.id}">
                            <input type="hidden" name="redirectUrl" value="/favoritos">

                            <button type="submit" class="btn btn-light rounded-circle text-danger shadow p-2"
                                    style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;"
                                    title="Quitar de favoritos">
                                <i class="bi bi-heart-fill fs-5"></i>
                            </button>
                        </form>
                    </div>

                </div>

                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <h5 class="card-title fw-bold text-light mb-0" th:text="${hotel.nombre}">Hotel Name</h5>
                    </div>

                    <p class="text-muted small mb-3">
                        <i class="bi bi-geo-alt-fill me-1 text-warning"></i>
                        <span th:text="${hotel.ubicacion}">Ubicación</span>
                    </p>

                    <div class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top border-secondary">
                        <span class="fs-5 fw-bold text-success">
                            <span th:text="${hotel.precioNoche}">0</span>€ <small class="text-muted fs-6">/noche</small>
                        </span>
                        <a th:href="@{/hoteles/{id}(id=${hotel.id})}" class="btn btn-outline-light btn-sm">
                            Ver Refugio
                        </a>
                    </div>
                </div>
            </div>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
