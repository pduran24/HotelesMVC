<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">

<head th:replace="~{fragments/layout :: head(${ruta.nombre} + ' - Senderismo')}"></head>

<body>
<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container py-4 pb-5">

    <div class="mb-4">
        <a href="javascript:history.back()" class="link-volver fw-bold">
            <i class="bi bi-arrow-left me-1"></i> Volver
        </a>
    </div>

    <div class="row g-5">

        <div class="col-lg-8">

            <div th:if="${ruta.imagenes != null and !ruta.imagenes.isEmpty()}" class="position-relative mb-5 shadow-lg" style="border-radius: 16px; overflow: hidden; border: 1px solid var(--madera-clara);">
                <div id="carruselRuta" class="carousel slide" data-bs-ride="carousel">
                    <div class="carousel-inner">
                        <div th:each="img, iterStat : ${ruta.imagenes}" class="carousel-item" th:classappend="${iterStat.first} ? 'active' : ''">
                            <img th:src="${img}" class="d-block w-100" alt="Foto de la ruta" style="height: 500px; object-fit: cover;">
                        </div>
                    </div>
                    <th:block th:if="${ruta.imagenes.size() > 1}">
                        <button class="carousel-control-prev" type="button" data-bs-target="#carruselRuta" data-bs-slide="prev">
                            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        </button>
                        <button class="carousel-control-next" type="button" data-bs-target="#carruselRuta" data-bs-slide="next">
                            <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        </button>
                    </th:block>
                </div>
            </div>

            <h1 class="fw-bold text-light mb-4" style="color: var(--madera-clara) !important;" th:text="${ruta.nombre}">Nombre Ruta</h1>

            <h5 class="fw-bold text-white mb-3">Descripción de la aventura</h5>
            <p class="fs-5 text-light opacity-75" style="line-height: 1.8;" th:text="${ruta.descripcion}">Descripción...</p>
        </div>

        <div class="col-lg-4">
            <div class="card card-detalle position-sticky" style="top: 20px; border-radius: 12px;">
                <div class="card-header border-secondary bg-transparent p-4">
                    <h4 class="fw-bold mb-0 text-white"><i class="bi bi-info-square-fill text-warning me-2"></i>Ficha Técnica</h4>
                </div>

                <div class="card-body p-4">
                    <ul class="list-group list-group-flush bg-transparent">

                        <li class="list-group-item bg-transparent text-light border-secondary d-flex justify-content-between align-items-center py-3">
                            <span><i class="bi bi-activity text-muted me-2"></i>Dificultad</span>
                            <span class="badge fs-6" th:classappend="'bg-' + ${ruta.color}" th:text="${ruta.dificultad}">Moderada</span>
                        </li>

                        <li class="list-group-item bg-transparent text-light border-secondary d-flex justify-content-between align-items-center py-3">
                            <span><i class="bi bi-arrow-left-right text-muted me-2"></i>Distancia Total</span>
                            <span class="fw-bold fs-5 text-warning"><span th:text="${ruta.distanciaKm}">12</span> km</span>
                        </li>

                        <li class="list-group-item bg-transparent text-light border-secondary d-flex justify-content-between align-items-center py-3">
                            <span><i class="bi bi-graph-up-arrow text-muted me-2"></i>Desnivel Positivo</span>
                            <span class="fw-bold fs-5 text-warning"><span th:text="${ruta.desnivelM}">500</span> m</span>
                        </li>

                    </ul>

                    <div class="mt-4 pt-3 border-top border-secondary text-center">
                        <p class="text-muted small mb-3">¿Listo para la aventura? Prepara tus botas, agua y consulta la meteorología antes de salir.</p>
                        <a th:href="'https://www.google.com/maps/dir/?api=1&destination=' + ${ruta.latitud} + ',' + ${ruta.longitud}" target="_blank" class="btn btn-rustico w-100 fw-bold py-2">
                            <i class="bi bi-map-fill me-2"></i>Ir al punto de inicio
                        </a>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
